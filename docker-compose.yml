services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calibra
      POSTGRES_USER: calibra
      POSTGRES_PASSWORD: calibra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibra"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://calibra:calibra@db:5432/calibra
      SECRET_KEY: ${SECRET_KEY:-change-this-before-production}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
volumes:
  pgdata:
