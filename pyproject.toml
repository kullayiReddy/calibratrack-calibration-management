[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibratrack"
version = "0.1.0"
description = "Industrial instrument calibration compliance platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pydantic-settings>=2.5", "python-multipart>=0.0.9", "passlib[argon2]>=1.7", "python-jose[cryptography]>=3.3", "faker>=30", "numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["backend*", "generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
