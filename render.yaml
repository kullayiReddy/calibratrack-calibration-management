services:
  - type: web
    name: calibratrack-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calibratrack-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: calibratrack-demo-db
    databaseName: calibra
    user: calibra
    plan: free
    region: singapore
    postgresMajorVersion: "18"
